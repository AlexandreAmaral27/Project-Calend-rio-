<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"

    <title>Calendário Familiar</title>

        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Pacifico&display=swap"
        rel="stylesheet"

    <style>

        /* =========================================
           PÁGINA DO CALENDÁRIO
        ========================================= */

        .family-page {

            min-height: 100vh;

            background:
                linear-gradient(
                    180deg,
                    #f7f9fc,
                    #ffffff
                );

        }


        /* =========================================
           TOPO
        ========================================= */

        .family-page-header {

            background:
                linear-gradient(
                    135deg,
                    #0f2f52,
                    #174a7c
                );

            color: white;

            padding: 35px 7%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 25px;

            flex-wrap: wrap;

        }


        .family-page-brand {

            display: flex;

            align-items: center;

            gap: 15px;

        }


        .family-page-brand-icon {

            width: 58px;
            height: 58px;

            border-radius: 16px;

            background:
                rgba(255,255,255,.15);

            border:
                1px solid
                rgba(255,255,255,.2);

            display: grid;

            place-items: center;

            font-weight: 800;

            font-size: 20px;

        }


        .family-page-brand h1 {

            margin: 0;

            font-size: 28px;

        }


        .family-page-brand p {

            margin: 5px 0 0;

            opacity: .75;

        }


        .back-button {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding: 12px 18px;

            border-radius: 12px;

            background: white;

            color: #0f2f52;

            text-decoration: none;

            font-weight: 700;

            transition: .25s;

        }


        .back-button:hover {

            transform: translateY(-2px);

        }


        /* =========================================
           AÇÕES
        ========================================= */

        .family-actions {

            max-width: 1400px;

            margin: 35px auto 0;

            padding: 0 5%;

            display: flex;

            justify-content: flex-end;

            gap: 10px;

            flex-wrap: wrap;

        }


        /* =========================================
           CALENDÁRIO
        ========================================= */

        .family-calendar-container {

            max-width: 1400px;

            margin: 30px auto;

            padding: 0 5% 60px;

        }


        .calendar-title {

            margin-bottom: 30px;

        }


        .calendar-title span {

            color: #174a7c;

            font-size: 12px;

            font-weight: 800;

            letter-spacing: 1px;

        }


        .calendar-title h2 {

            margin: 8px 0 5px;

            font-size: 38px;

            color: #102a43;

        }


        .calendar-title p {

            color: #64748b;

        }


        /* =========================================
           PERFIL DA FAMÍLIA
        ========================================= */

        .family-profile {

            display: grid;

            grid-template-columns: 280px 1fr;

            gap: 30px;

            align-items: center;

            margin-bottom: 35px;

            background: white;

            border: 1px solid #e4eaf1;

            border-radius: 22px;

            padding: 25px;

            box-shadow:
                0 12px 35px
                rgba(15, 23, 42, .06);

        }


        .family-photo {

            width: 100%;

            height: 220px;

            border-radius: 18px;

            overflow: hidden;

            background: #e8f1fa;

        }


        .family-photo img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;

        }


        #familyLocation {

            color: #64748b;

            margin: 10px 0;

        }


        #familyPhrase {

            color: #174a7c;

            font-weight: 700;

            font-style: italic;

            margin-top: 15px;

        }


        /* =========================================
           MESES
        ========================================= */

        .family-months {

            display: grid;

            grid-template-columns:
                repeat(
                    3,
                    1fr
                );

            gap: 22px;

        }


        .family-month {

            background: white;

            border:
                1px solid
                #e4eaf1;

            border-radius: 18px;

            padding: 20px;

            box-shadow:
                0 12px 35px
                rgba(
                    15,
                    23,
                    42,
                    .06
                );

        }


        .family-month h3 {

            text-align: center;

            color: #0f2f52;

            margin: 0 0 18px;

            font-size: 19px;

        }


        .family-weekdays {

            display: grid;

            grid-template-columns:
                repeat(7,1fr);

            gap: 5px;

            margin-bottom: 7px;

        }


        .family-weekdays span {

            text-align: center;

            font-size: 10px;

            font-weight: 800;

            color: #94a3b8;

        }


        .family-days {

            display: grid;

            grid-template-columns:
                repeat(7,1fr);

            gap: 5px;

        }


        .family-day {

            min-height: 42px;

            border-radius: 9px;

            display: flex;

            align-items: center;

            justify-content: center;

            position: relative;

            font-size: 13px;

            background: #f8fafc;

            cursor: pointer;

        }


        .family-day:hover {

            background: #e8f1fa;

        }


        .family-day.empty {

            background:
                transparent;

            cursor: default;

        }


        .family-day.birthday {

            background: #fff1f2;

            color: #be123c;

            font-weight: 800;

        }


        .family-day.event {

            background: #e8f1fa;

            color: #174a7c;

            font-weight: 800;

        }


        .family-day.birthday.event {

            background:
                linear-gradient(
                    135deg,
                    #fff1f2,
                    #e8f1fa
                );

        }


        .event-dot {

            width: 5px;

            height: 5px;

            border-radius: 50%;

            background: currentColor;

            position: absolute;

            bottom: 5px;

        }


        /* =========================================
           INFORMAÇÕES
        ========================================= */

        .family-info {

            display: grid;

            grid-template-columns:
                repeat(3,1fr);

            gap: 20px;

            margin-top: 35px;

        }


        .info-card {

            background: white;

            border:
                1px solid
                #e4eaf1;

            border-radius: 18px;

            padding: 25px;

            box-shadow:
                0 10px 30px
                rgba(
                    15,
                    23,
                    42,
                    .05
                );

        }


        .info-card h3 {

            margin-top: 0;

            color: #0f2f52;

        }


        .info-card ul {

            padding-left: 20px;

            color: #64748b;

            line-height: 1.9;

        }


        /* =========================================
           FERIADOS NACIONAIS DE ANGOLA
        ========================================= */

        .family-day.national {
            color: white;
            font-weight: 800;
            border: 2px solid transparent;
        }

        .family-day.national::after {
            content: "";
            position: absolute;
            top: 4px;
            right: 5px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,.9);
        }

        .national-jan { background:#2563eb !important; }
        .national-feb { background:#dc2626 !important; }
        .national-mar { background:#db2777 !important; }
        .national-apr { background:#16a34a !important; }
        .national-may { background:#f59e0b !important; color:#172033 !important; }
        .national-jun { background:#7c3aed !important; }
        .national-sep { background:#0891b2 !important; }
        .national-nov { background:#ea580c !important; }
        .national-dec { background:#475569 !important; }

        .national-legend {
            margin-top: 25px;
            padding: 20px;
            background: white;
            border: 1px solid #e4eaf1;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(15,23,42,.05);
        }

        .national-legend h3 {
            margin: 0 0 15px;
            color:#0f2f52;
        }

        .national-legend-list {
            display:flex;
            flex-wrap:wrap;
            gap:10px;
        }

        .national-legend-item {
            display:flex;
            align-items:center;
            gap:8px;
            padding:8px 12px;
            border-radius:10px;
            background:#f8fafc;
            color:#475569;
            font-size:12px;
            font-weight:700;
        }

        .national-color {
            width:12px;
            height:12px;
            border-radius:50%;
            flex:none;
        }

        /* =========================================
           MEMÓRIAS EM DESTAQUE
        ========================================= */

        .memory-slider {
            position:relative;
            overflow:hidden;
            border-radius:16px;
        }

        .memory-slide {
            display:none;
            animation: memoryFade .7s ease;
        }

        .memory-slide.active {
            display:block;
        }

        .memory-image {
            width:100%;
            height:210px;
            object-fit:cover;
            display:block;
            border-radius:14px;
            background:#e8f1fa;
        }

        .memory-content {
            padding:14px 4px 4px;
        }

        .memory-content h4 {
            margin:0 0 6px;
            color:#0f2f52;
            font-size:17px;
        }

        .memory-content p {
            margin:0;
            color:#64748b;
            line-height:1.6;
            font-size:13px;
        }

        .memory-counter {
            margin-top:12px;
            text-align:center;
            color:#94a3b8;
            font-size:12px;
            font-weight:700;
        }

        @keyframes memoryFade {
            from { opacity:0; transform:translateX(12px); }
            to { opacity:1; transform:translateX(0); }
        }

        /* =========================================
           RESPONSIVO
        ========================================= */

        @media(max-width:1000px) {

            .family-months {

                grid-template-columns:
                    repeat(2,1fr);

            }

            .family-info {

                grid-template-columns:
                    1fr;

            }

        }


        @media(max-width:650px) {

            .family-months {

                grid-template-columns:
                    1fr;

            }

            .family-page-header {

                padding: 25px 5%;

            }

            .calendar-title h2 {

                font-size: 30px;

            }

            .family-profile {

                grid-template-columns:
                    1fr;

            }

            .family-photo {

                height: 250px;

            }

        }


        /* =========================================
           IMPRESSÃO A3
        ========================================= */

        @media print {

            @page {

                size: A3 landscape;

                margin: 10mm;

            }

            .family-page-header,
            .family-actions {

                display: none;

            }

            .family-calendar-container {

                max-width: none;

                padding: 0;

            }

            .family-months {

                grid-template-columns:
                    repeat(4,1fr);

                gap: 8mm;

            }

            .family-month {

                box-shadow: none;

                break-inside: avoid;

            }

        }

    </style>

</head>

        </div>

    `;

    throw new Error(
        "Família não encontrada"
    );

}

/* =========================================
   MESES
========================================= */

const monthNames = [

    "Janeiro",
    "Fevereiro",
    "Março",
    "Abril",
    "Maio",
    "Junho",
    "Julho",
    "Agosto",
    "Setembro",
    "Outubro",
    "Novembro",
    "Dezembro"

];


function renderCalendar() {

    familyMonths.innerHTML = "";


    monthNames.forEach(
        (
            monthName,
            monthIndex
        ) => {


            const firstDay =
                new Date(
                    family.year,
                    monthIndex,
                    1
                );


            const totalDays =
                new Date(
                    family.year,
                    monthIndex + 1,
                    0
                ).getDate();


            const month =
                document.createElement(
                    "article"
                );


            month.className =
                "family-month";


            let html = `

                <h3>
                    ${monthName}
                </h3>

                <div class="family-weekdays">

                    <span>D</span>
                    <span>S</span>
                    <span>T</span>
                    <span>Q</span>
                    <span>Q</span>
                    <span>S</span>
                    <span>S</span>

                </div>

                <div class="family-days">

            `;


            for (
                let i = 0;
                i < firstDay.getDay();
                i++
            ) {

                html += `
                    <span class="family-day empty"></span>
                `;

            }


            for (
                let day = 1;
                day <= totalDays;
                day++
            ) {


                const date =
                    `${family.year}-${String(
                        monthIndex + 1
                    ).padStart(2,"0")}-${String(
                        day
                    ).padStart(2,"0")}`;


                const birthday =
                    family.birthdays.find(
                        person => {


                            const d =
                                new Date(
                                    person.date +
                                    "T00:00:00"
                                );


                            return (

                                d.getMonth()
                                === monthIndex

                                &&

                                d.getDate()
                                === day

                            );

                        }
                    );


                const events =
                    family.events.filter(
                        event =>
                            event.date === date
                    );


                let classes =
                    "family-day";


                if (birthday) {

                    classes +=
                        " birthday";

                }


                if (events.length) {

                    classes +=
                        " event";

                }


                let title = "";


                if (birthday) {

                    title +=
                        `🎂 ${birthday.name}`;

                }


                if (events.length) {

                    if (title)
                        title += " | ";


                    title +=
                        events
                            .map(
                                event =>
                                    `🎉 ${event.title}`
                            )
                            .join(" | ");

                }


                html += `

                    <span
                        class="${classes}"
                        title="${title}"
                    >

                        ${day}

                        ${
                            title
                            ? `<span class="event-dot"></span>`
                            : ""
                        }

                    </span>

                `;

            }


            html += `
                </div>
            `;


            month.innerHTML =
                html;


            familyMonths.appendChild(
                month
            );

        }
    );

}

                    (${person.relation})

            `;


            birthdayInfo.appendChild(
                li
            );

        }
    );

}


/* =========================================
   EVENTOS
========================================= */

function renderEvents() {

    eventInfo.innerHTML = "";

    const allEvents = [
        ...family.events.map(event => ({ ...event, national: false })),
        ...angolaNationalHolidays.map(event => ({ ...event, national: true }))
    ].sort((a,b) => a.date.localeCompare(b.date));

    allEvents.forEach(
        event => {

            const li =
                document.createElement(
                    "li"
                );

            const date =
                new Date(
                    event.date +
                    "T00:00:00"
                );

            const formatted =
                date.toLocaleDateString(
                    "pt-PT",
                    {
                        day: "2-digit",
                        month: "long"
                    }
                );

            li.innerHTML = `
                ${event.national ? "🇦🇴 " : "🎉 "}
                <strong>${formatted}</strong>
                — ${event.title}
            `;

            eventInfo.appendChild(
                li
            );

        }
    );

}


/* =========================================
   MEMÓRIAS
========================================= */

function renderMemories() {

    memoryInfo.innerHTML = "";

    family.memories.forEach(
        (memory, index) => {

            const slide =
                document.createElement("div");

            slide.className =
                `memory-slide ${index === 0 ? "active" : ""}`;

            slide.innerHTML = `
                <img
                    class="memory-image"
                    src="${memory.image}"
                    alt="${memory.title}"
                    onerror="this.style.display='none';"
                >

                <div class="memory-content">
                    <h4>${memory.title}</h4>
                    <p>${memory.description}</p>
                </div>
            `;

            memoryInfo.appendChild(slide);

        }
    );

    if (family.memories.length > 1) {
        const counter = document.createElement("div");
        counter.className = "memory-counter";
        counter.id = "memoryCounter";
        memoryInfo.appendChild(counter);

        let current = 0;

        const updateMemory = () => {
            const slides =
                memoryInfo.querySelectorAll(".memory-slide");

            slides.forEach(slide =>
                slide.classList.remove("active")
            );

            slides[current].classList.add("active");

            counter.textContent =
                `${current + 1} / ${slides.length}`;
        };

        updateMemory();

        setInterval(() => {
            current =
                (current + 1) % family.memories.length;

            updateMemory();
        }, 4000);
    }

}

                );

            } = window.jspdf;


            const pdf =
                new jsPDF({

                    orientation:
                        "landscape",

                    unit:
                        "mm",

                    format:
                        "a3"

                });


            const image =
                canvas.toDataURL(
                    "image/jpeg",
                    .95
                );


            pdf.addImage(
                image,
                "JPEG",
                0,
                0,
                420,
                297
            );


            pdf.save(
                `${family.name
                    .replace(/\s+/g,"-")
                }-Calendario-${family.year}.pdf`
            );

        }
    );
