<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Calendário Familiar</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Pacifico&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="estilo/style.css"
    >

    <style>

        /* =========================================
           PÁGINA DO CALENDÁRIO
        ========================================= */

        .family-page {

            min-height: 100vh;

            background:
                linear-gradient(
                    180deg,
                    #f7f9fc,
                    #ffffff
                );

        }


        /* =========================================
           TOPO
        ========================================= */

        .family-page-header {

            background:
                linear-gradient(
                    135deg,
                    #0f2f52,
                    #174a7c
                );

            color: white;

            padding: 35px 7%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 25px;

            flex-wrap: wrap;

        }


        .family-page-brand {

            display: flex;

            align-items: center;

            gap: 15px;

        }


        .family-page-brand-icon {

            width: 58px;
            height: 58px;

            border-radius: 16px;

            background:
                rgba(255,255,255,.15);

            border:
                1px solid
                rgba(255,255,255,.2);

            display: grid;

            place-items: center;

            font-weight: 800;

            font-size: 20px;

        }


        .family-page-brand h1 {

            margin: 0;

            font-size: 28px;

        }


        .family-page-brand p {

            margin: 5px 0 0;

            opacity: .75;

        }


        .back-button {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding: 12px 18px;

            border-radius: 12px;

            background: white;

            color: #0f2f52;

            text-decoration: none;

            font-weight: 700;

            transition: .25s;

        }


        .back-button:hover {

            transform: translateY(-2px);

        }


        /* =========================================
           AÇÕES
        ========================================= */

        .family-actions {

            max-width: 1400px;

            margin: 35px auto 0;

            padding: 0 5%;

            display: flex;

            justify-content: flex-end;

            gap: 10px;

            flex-wrap: wrap;

        }


        /* =========================================
           CALENDÁRIO
        ========================================= */

        .family-calendar-container {

            max-width: 1400px;

            margin: 30px auto;

            padding: 0 5% 60px;

        }


        .calendar-title {

            margin-bottom: 30px;

        }


        .calendar-title span {

            color: #174a7c;

            font-size: 12px;

            font-weight: 800;

            letter-spacing: 1px;

        }


        .calendar-title h2 {

            margin: 8px 0 5px;

            font-size: 38px;

            color: #102a43;

        }


        .calendar-title p {

            color: #64748b;

        }


        /* =========================================
           PERFIL DA FAMÍLIA
        ========================================= */

        .family-profile {

            display: grid;

            grid-template-columns: 280px 1fr;

            gap: 30px;

            align-items: center;

            margin-bottom: 35px;

            background: white;

            border: 1px solid #e4eaf1;

            border-radius: 22px;

            padding: 25px;

            box-shadow:
                0 12px 35px
                rgba(15, 23, 42, .06);

        }


        .family-photo {

            width: 100%;

            height: 220px;

            border-radius: 18px;

            overflow: hidden;

            background: #e8f1fa;

        }


        .family-photo img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;

        }


        #familyLocation {

            color: #64748b;

            margin: 10px 0;

        }


        #familyPhrase {

            color: #174a7c;

            font-weight: 700;

            font-style: italic;

            margin-top: 15px;

        }


        /* =========================================
           MESES
        ========================================= */

        .family-months {

            display: grid;

            grid-template-columns:
                repeat(
                    3,
                    1fr
                );

            gap: 22px;

        }


        .family-month {

            background: white;

            border:
                1px solid
                #e4eaf1;

            border-radius: 18px;

            padding: 20px;

            box-shadow:
                0 12px 35px
                rgba(
                    15,
                    23,
                    42,
                    .06
                );

        }


        .family-month h3 {

            text-align: center;

            color: #0f2f52;

            margin: 0 0 18px;

            font-size: 19px;

        }


        .family-weekdays {

            display: grid;

            grid-template-columns:
                repeat(7,1fr);

            gap: 5px;

            margin-bottom: 7px;

        }


        .family-weekdays span {

            text-align: center;

            font-size: 10px;

            font-weight: 800;

            color: #94a3b8;

        }


        .family-days {

            display: grid;

            grid-template-columns:
                repeat(7,1fr);

            gap: 5px;

        }


        .family-day {

            min-height: 42px;

            border-radius: 9px;

            display: flex;

            align-items: center;

            justify-content: center;

            position: relative;

            font-size: 13px;

            background: #f8fafc;

            cursor: pointer;

        }


        .family-day:hover {

            background: #e8f1fa;

        }


        .family-day.empty {

            background:
                transparent;

            cursor: default;

        }


        .family-day.birthday {

            background: #fff1f2;

            color: #be123c;

            font-weight: 800;

        }


        .family-day.event {

            background: #e8f1fa;

            color: #174a7c;

            font-weight: 800;

        }


        .family-day.birthday.event {

            background:
                linear-gradient(
                    135deg,
                    #fff1f2,
                    #e8f1fa
                );

        }


        .event-dot {

            width: 5px;

            height: 5px;

            border-radius: 50%;

            background: currentColor;

            position: absolute;

            bottom: 5px;

        }


        /* =========================================
           INFORMAÇÕES
        ========================================= */

        .family-info-top {

            margin-top: 0;

            margin-bottom: 30px;

        }


        .family-info-top .info-card {

            min-height: 100%;

        }


        .family-info {

            display: grid;

            grid-template-columns:
                repeat(3,1fr);

            gap: 20px;

            margin-top: 35px;

        }


        .info-card {

            background: white;

            border:
                1px solid
                #e4eaf1;

            border-radius: 18px;

            padding: 25px;

            box-shadow:
                0 10px 30px
                rgba(
                    15,
                    23,
                    42,
                    .05
                );

        }


        .info-card h3 {

            margin-top: 0;

            color: #0f2f52;

        }


        .info-card ul {

            padding-left: 20px;

            color: #64748b;

            line-height: 1.9;

        }


        /* =========================================
           FERIADOS NACIONAIS DE ANGOLA
        ========================================= */

        .family-day.national {

            color: white;

            font-weight: 800;

            border: 2px solid transparent;

        }


        .family-day.national::after {

            content: "";

            position: absolute;

            top: 4px;

            right: 5px;

            width: 6px;

            height: 6px;

            border-radius: 50%;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .9
                );

        }

/* =========================================
   CORES DO CALENDÁRIO
========================================= */

/* Datas da família */
.family-day.family-date {

    background: #2563eb;

    color: white;

    font-weight: 800;

}


/* Feriados / Pontos legais */

.family-day.national {

    color: white;

    font-weight: 800;

    border: 2px solid transparent;

}


/* Quando existe feriado + data familiar */
.family-day.national.family-date {

    color: white;

    font-weight: 800;

}


/* Pequeno indicador no canto */

.family-day.national::after {

    content: "";

    position: absolute;

    top: 4px;

    right: 5px;

    width: 6px;

    height: 6px;

    border-radius: 50%;

    background: rgba(255,255,255,.95);

}


/* Marcador das datas familiares */

.family-day.family-date .event-dot {

    background: white;

}


/* Legenda */

.national-color {

    width: 12px;

    height: 12px;

    border-radius: 50%;

    flex: none;

}


/* Azul = família */

.family-color {

    background: #2563eb;

}

        .national-legend {

            margin-top: 25px;

            padding: 20px;

            background: white;

            border:
                1px solid
                #e4eaf1;

            border-radius: 18px;

            box-shadow:
                0 10px 30px
                rgba(
                    15,
                    23,
                    42,
                    .05
                );

        }


        .national-legend h3 {

            margin: 0 0 15px;

            color:#0f2f52;

        }


        .national-legend-list {

            display:flex;

            flex-wrap:wrap;

            gap:10px;

        }


        .national-legend-item {

            display:flex;

            align-items:center;

            gap:8px;

            padding:8px 12px;

            border-radius:10px;

            background:#f8fafc;

            color:#475569;

            font-size:12px;

            font-weight:700;

        }


        .national-color {

            width:12px;

            height:12px;

            border-radius:50%;

            flex:none;

        }
/* =========================================
   MEMÓRIAS EM DESTAQUE
========================================= */

.memory-slider {
    position: relative;
    border-radius: 16px;
}

.memory-slide {
    display: none;
    animation: memoryFade .35s ease;
    cursor: pointer;
}

.memory-slide.active {
    display: block;
}

.memory-image {
    width: 100%;
    height: 210px;
    object-fit: cover;
    display: block;
    border-radius: 14px;
    background: #e8f1fa;
}

.memory-content {
    padding: 14px 4px 4px;
}

.memory-content h4 {
    margin: 0 0 6px;
    color: #0f2f52;
    font-size: 17px;
}

.memory-content p {
    margin: 0;
    color: #64748b;
    line-height: 1.6;
    font-size: 13px;
}

.memory-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 14px;
    gap: 10px;
}

.memory-arrow {
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 50%;
    background: #0f2f52;
    color: white;
    font-size: 20px;
    font-weight: 800;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: .2s;
}

.memory-arrow:hover {
    background: #174a7c;
    transform: scale(1.05);
}

.memory-counter {
    text-align: center;
    color: #94a3b8;
    font-size: 12px;
    font-weight: 700;
}


/* =========================================
   MEMÓRIA ABERTA
========================================= */

.memory-modal {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(15, 23, 42, .88);
    z-index: 20000;
}

.memory-modal.active {
    display: flex;
}

.memory-modal-content {
    position: relative;
    width: 100%;
    max-width: 1000px;
    max-height: 92vh;
    background: white;
    border-radius: 22px;
    padding: 20px;
    box-shadow: 0 25px 80px rgba(0,0,0,.4);
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: memoryModalOpen .25s ease;
}

.memory-modal-image {
    width: 100%;
    max-height: 72vh;
    object-fit: contain;
    border-radius: 15px;
    background: #e8f1fa;
}

.memory-modal-title {
    width: 100%;
    margin-top: 14px;
    color: #0f2f52;
    font-size: 20px;
    font-weight: 800;
    text-align: center;
}

.memory-modal-description {
    width: 100%;
    margin-top: 5px;
    color: #64748b;
    font-size: 14px;
    line-height: 1.6;
    text-align: center;
}

.memory-modal-close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: #dc2626;
    color: white;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    z-index: 3;
}

.memory-modal-close:hover {
    background: #b91c1c;
}

.memory-modal-controls {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 15px;
}

.memory-modal-arrow {
    width: 46px;
    height: 46px;
    border: none;
    border-radius: 50%;
    background: #0f2f52;
    color: white;
    font-size: 23px;
    font-weight: 800;
    cursor: pointer;
    transition: .2s;
}

.memory-modal-arrow:hover {
    background: #174a7c;
    transform: scale(1.05);
}

.memory-modal-counter {
    color: #94a3b8;
    font-size: 13px;
    font-weight: 700;
}

@keyframes memoryFade {
    from {
        opacity: 0;
        transform: translateX(12px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }
}

@keyframes memoryModalOpen {
    from {
        opacity: 0;
        transform: scale(.95);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}


@media(max-width:650px) {

    .memory-image {
        height: 190px;
    }

    .memory-modal {
        padding: 10px;
    }

    .memory-modal-content {
        padding: 12px;
        border-radius: 18px;
    }

    .memory-modal-image {
        max-height: 65vh;
    }

    .memory-modal-title {
        font-size: 17px;
    }

}

        /* =========================================
           RESPONSIVO
        ========================================= */

        @media(max-width:1000px) {

            .family-months {

                grid-template-columns:
                    repeat(2,1fr);

            }


            .family-info {

                grid-template-columns:
                    1fr;

            }

        }


        @media(max-width:650px) {

            .family-months {

                grid-template-columns:
                    1fr;

            }


            .family-page-header {

                padding:
                    25px 5%;

            }


            .calendar-title h2 {

                font-size:30px;

            }


            .family-profile {

                grid-template-columns:
                    1fr;

            }


            .family-photo {

                height:250px;

            }

        }


        /* =========================================
           IMPRESSÃO A3
        ========================================= */

        @media print {

            @page {

                size:A3 landscape;

                margin:10mm;

            }


            .family-page-header,
            .family-actions {

                display:none;

            }


            .family-calendar-container {

                max-width:none;

                padding:0;

            }


            .family-months {

                grid-template-columns:
                    repeat(4,1fr);

                gap:8mm;

            }


            .family-month {

                box-shadow:none;

                break-inside:avoid;

            }

        }


        /* =========================================
           INTERAÇÃO DAS DATAS + POP-UP
        ========================================= */

        .family-day.has-info {

            cursor: pointer;

            transition:
                transform .18s ease,
                box-shadow .18s ease;

        }


        .family-day.has-info:hover {

            transform: scale(1.07);

            box-shadow:
                0 5px 16px
                rgba(15, 47, 82, .25);

            z-index: 2;

        }


        .date-modal {

            position: fixed;

            inset: 0;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background: rgba(15, 23, 42, .72);

            z-index: 10000;

        }


        .date-modal.active {

            display: flex;

        }


        .date-modal-content {

            width: 100%;

            max-width: 540px;

            max-height: 90vh;

            overflow-y: auto;

            background: #ffffff;

            border-radius: 22px;

            padding: 28px;

            box-shadow:
                0 25px 70px
                rgba(0,0,0,.30);

            animation:
                dateModalOpen .22s ease;

        }


        @keyframes dateModalOpen {

            from {

                opacity: 0;

                transform:
                    translateY(18px)
                    scale(.97);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        .date-modal-header {

            display: flex;

            align-items: flex-start;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 22px;

        }


        .date-modal-header h3 {

            margin: 0;

            color: #0f2f52;

            font-size: 24px;

        }


        .date-modal-date {

            margin: 6px 0 0;

            color: #64748b;

            font-size: 14px;

            font-weight: 600;

            text-transform: capitalize;

        }


        .date-modal-close {

            width: 40px;

            height: 40px;

            flex: none;

            border: none;

            border-radius: 50%;

            background: #dc2626;

            color: white;

            font-size: 18px;

            font-weight: 800;

            cursor: pointer;

        }


        .date-modal-close:hover {

            background: #b91c1c;

        }


        .date-modal-items {

            display: flex;

            flex-direction: column;

            gap: 12px;

        }


        .date-modal-item {

            padding: 15px;

            border-radius: 14px;

            background: #f8fafc;

            border-left: 5px solid #2563eb;

        }


        .date-modal-item.national {

            border-left-color: var(--date-modal-national-color, #dc2626);

        }


        .date-modal-item-title {

            color: #0f2f52;

            font-weight: 800;

            margin-bottom: 5px;

        }


        .date-modal-item-text {

            color: #64748b;

            font-size: 14px;

            line-height: 1.6;

        }


        @media(max-width:650px) {

            .date-modal {

                padding: 12px;

            }


            .date-modal-content {

                padding: 22px;

                border-radius: 18px;

            }


            .date-modal-header h3 {

                font-size: 20px;

            }

        }

    </style>

</head>

         HEADER

        <div class="family-page-brand">

            <div

                <p id="familyYear">

        </div>

    </header>


    <!-- =====================================
         AÇÕES

    <div class="family-actions">

        <button

                <h3>

        <!-- =====================================
             MESES
        ====================================== -->

        <!-- =====================================
             FERIADOS NACIONAIS
        ====================================== -->

        <div class="national-legend">

            <h3>
              Identificação das Datas
            </h3>

            <div
                class="national-legend-list"
                id="nationalLegend"
            ></div>

        </div>


        <!-- =====================================
             MEMÓRIAS
        ====================================== -->

        <div class="family-info">


            <div class="info-card">

                <h3>
                    ❤️ Memórias
                </h3>


                <div
                    id="memoryInfo"
                    class="memory-slider"
                ></div>

            </div>


        </div>


    </main>


</div>

/* =========================================
   CALENDÁRIO
========================================= */

function renderCalendar() {

    familyMonths.innerHTML = "";


    monthNames.forEach(
        (
            monthName,
            monthIndex
        ) => {

            const firstDay =
                new Date(
                    family.year,
                    monthIndex,
                    1
                );


            const totalDays =
                new Date(
                    family.year,
                    monthIndex + 1,
                    0
                ).getDate();


            const month =
                document.createElement("article");


            month.className =
                "family-month";


            let html = `

                <h3>
                    ${monthName}
                </h3>

                <div class="family-weekdays">
                    <span>D</span>
                    <span>S</span>
                    <span>T</span>
                    <span>Q</span>
                    <span>Q</span>
                    <span>S</span>
                    <span>S</span>
                </div>

                <div class="family-days">
            `;


            for (
                let i = 0;
                i < firstDay.getDay();
                i++
            ) {

                html += `
                    <span class="family-day empty"></span>
                `;

            }


            for (
                let day = 1;
                day <= totalDays;
                day++
            ) {

                const date =
                    `${family.year}-${String(monthIndex + 1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;


                /* =============================
                   ANIVERSÁRIOS
                   Compara dia + mês, porque o
                   ano de nascimento é histórico.
                ============================= */

                const birthdays =
                    family.birthdays.filter(
                        person => {

                            const d =
                                new Date(
                                    person.date + "T00:00:00"
                                );

                            return (
                                d.getMonth() === monthIndex &&
                                d.getDate() === day
                            );

                        }
                    );


                /* =============================
                   DATAS MARCANTES
                   Compara dia + mês, mantendo
                   o ano original da data.
                ============================= */

                const events =
                    family.events.filter(
                        event =>
                            isSameMonthDay(
                                event.date,
                                date
                            )
                    );


                /* =============================
                   CONQUISTAS
                   São datas do próprio calendário.
                ============================= */

                const achievements =
                    (family.achievements || [])
                        .filter(
                            achievement =>
                                achievement.date === date
                        );


                /* =============================
                   FERIADO / PONTO LEGAL
                ============================= */

                const national =
                    angolaNationalHolidays.find(
                        holiday =>
                            holiday.date === date
                    );


                const hasFamilyDate =
                    Boolean(
                        birthdays.length ||
                        events.length ||
                        achievements.length
                    );


                const hasInfo =
                    Boolean(
                        national ||
                        hasFamilyDate
                    );


                let classes =
                    "family-day";


                if (national) {
                    classes += " national";
                }


                if (hasFamilyDate) {
                    classes += " family-date";
                }


                if (hasInfo) {
                    classes += " has-info";
                }


                /* =============================
                   CORES
                ============================= */

                let background = "#f8fafc";


                if (
                    hasFamilyDate &&
                    !national
                ) {
                    background = "#2563eb";
                }


                if (
                    national &&
                    !hasFamilyDate
                ) {
                    background = national.color;
                }


                /* Feriado/PL + data familiar:
                   metade na cor do feriado e
                   metade azul da família. */

                if (
                    national &&
                    hasFamilyDate
                ) {
                    background =
                        `linear-gradient(
                            135deg,
                            ${national.color} 0%,
                            ${national.color} 50%,
                            #2563eb 50%,
                            #2563eb 100%
                        )`;
                }


                /* =============================
                   TÍTULO NATIVO
                ============================= */

                const titleParts = [];


                if (national) {
                    titleParts.push(
                        `🇦🇴 ${national.title} — ${national.type}`
                    );
                }


                birthdays.forEach(
                    person => {
                        titleParts.push(
                            `🎂 ${person.name} — Aniversário`
                        );
                    }
                );


                events.forEach(
                    event => {
                        titleParts.push(
                            `🎉 ${event.title} — Data marcante`
                        );
                    }
                );


                achievements.forEach(
                    achievement => {
                        titleParts.push(
                            `🏆 ${achievement.title} — Conquista familiar`
                        );
                    }
                );


                html += `

                    <span
                        class="${classes}"
                        data-date="${date}"
                        title="${titleParts.join(" | ")}"
                        style="background:${background};"
                    >

                        ${day}

                        ${
                            hasInfo
                            ? `<span class="event-dot" style="background:#ffffff;"></span>`
                            : ""
                        }

                    </span>

                `;

            }


            html += `
                </div>
            `;


            month.innerHTML = html;

            familyMonths.appendChild(month);


            /* =============================
               CLIQUE NAS DATAS MARCADAS
            ============================= */

            month
                .querySelectorAll(".family-day.has-info")
                .forEach(
                    dayElement => {

                        dayElement.addEventListener(
                            "click",
                            () => {

                                openDateModal(
                                    dayElement.dataset.date
                                );

                            }
                        );

                    }
                );

        }
    );

}


/* =========================================
   COMPARAR APENAS DIA + MÊS
========================================= */

function isSameMonthDay(
    originalDate,
    calendarDate
) {

    if (!originalDate || !calendarDate) {
        return false;
    }


    const original =
        new Date(
            originalDate + "T00:00:00"
        );


    const current =
        new Date(
            calendarDate + "T00:00:00"
        );


    return (
        original.getMonth() === current.getMonth() &&
        original.getDate() === current.getDate()
    );

}

    const birthdays =

                    🎂 ${person.name}
                </div>

                <div class="date-modal-item-text">
                    Aniversário
                    ${
                        person.relation
                        ? `• ${person.relation}`
                        : ""
                    }
                </div>

            `;

            modalItems.appendChild(item);

        }
    );


    /* =============================
       DATAS MARCANTES
       Mantém o ano original.
    ============================= */

    const events =
        family.events.filter(
            event =>
                isSameMonthDay(
                    event.date,
                    date
                )
        );


    events.forEach(
        event => {

            const item =
                document.createElement("div");

            item.className =
                "date-modal-item";

            const eventDate =
                new Date(
                    event.date + "T00:00:00"
                );

            const eventYear =
                eventDate.getFullYear();

            item.innerHTML = `

                <div class="date-modal-item-title">
                    🎉 ${event.title}
                </div>

                <div class="date-modal-item-text">
                    Data marcante da família
                    — ${eventYear}
                </div>

            `;

            modalItems.appendChild(item);

        }
    );


    /* =============================
       CONQUISTAS
    ============================= */

    const achievements =
        (family.achievements || [])
            .filter(
                achievement =>
                    achievement.date === date
            );


    achievements.forEach(
        achievement => {

            const item =
                document.createElement("div");

            item.className =
                "date-modal-item";

            item.innerHTML = `

                <div class="date-modal-item-title">
                    🏆 ${achievement.title}
                </div>

                <div class="date-modal-item-text">
                    ${
                        achievement.description ||
                        "Conquista familiar."
                    }
                </div>

            `;

            modalItems.appendChild(item);

        }
    );


    modal.classList.add("active");
    modal.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";

}


function closeDateModal() {

    const modal =
        document.getElementById("dateModal");


    modal.classList.remove("active");
    modal.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";

}


document.addEventListener(
    "click",
    event => {

        const modal =
            document.getElementById("dateModal");


        if (event.target === modal) {
            closeDateModal();
        }

    }
);


document.addEventListener(
    "keydown",
    event => {

        if (event.key === "Escape") {
            closeDateModal();
        }

    }
);

/* =========================================
   CONQUISTAS FAMILIARES
========================================= */

function renderAchievements() {

    achievementInfo.innerHTML = "";


    if (
        !family.achievements ||
        family.achievements.length === 0
    ) {

        const li =
            document.createElement("li");

        li.textContent =
            "Nenhuma conquista registada ainda.";

        achievementInfo.appendChild(li);

        return;

    }


    family.achievements
        .slice()
        .sort(
            (a, b) =>
                (a.date || "")
                .localeCompare(b.date || "")
        )
        .forEach(
            achievement => {

                const li =
                    document.createElement("li");

                let dateText = "";


                if (achievement.date) {

                    const date =
                        new Date(
                            achievement.date + "T00:00:00"
                        );

                    dateText =
                        date.toLocaleDateString(
                            "pt-PT",
                            {
                                month: "long",
                                year: "numeric"
                            }
                        ).toUpperCase();

                }


                li.innerHTML = `

                    <strong>
                        🏆 ${achievement.title}
                    </strong>

                    ${
                        dateText
                        ? ` — ${dateText}`
                        : ""
                    }

                    ${
                        achievement.description
                        ? `<br>
                           <small>
                               ${achievement.description}
                           </small>`
                        : ""
                    }

                `;

                achievementInfo.appendChild(li);

            }
        );

}

/* =========================================

function renderMemories() {

    memoryInfo.innerHTML = "";

    let current = 0;


    /* =========================================
       CRIAR MEMÓRIAS
    ========================================= */

    family.memories.forEach(
        (
            memory,
            index
        ) => {

            const slide =
                document.createElement("div");


            slide.className =
                `memory-slide ${
                    index === 0
                    ? "active"
                    : ""
                }`;


            slide.innerHTML = `

                <img
                    class="memory-image"
                    src="${memory.image}"
                    alt="${memory.title}"
                    onerror="this.style.display='none';"
                >

                <div class="memory-content">

                    <h4>
                        ${memory.title}
                    </h4>

                    <p>
                        ${memory.description}
                    </p>

                </div>

            `;


            /* CLICAR NA MEMÓRIA */

            slide.addEventListener(
                "click",
                () => {

                    openMemoryModal(
                        index
                    );

                }
            );


            memoryInfo.appendChild(
                slide
            );

        }
    );


    /* =========================================
       CONTROLES DAS MEMÓRIAS
    ========================================= */

    if (
        family.memories.length > 1
    ) {

        const controls =
            document.createElement("div");


        controls.className =
            "memory-controls";


        controls.innerHTML = `

            <button
                type="button"
                class="memory-arrow"
                id="memoryPrev"
                aria-label="Memória anterior"
            >
                ←
            </button>


            <div
                class="memory-counter"
                id="memoryCounter"
            >
                1 / ${family.memories.length}
            </div>


            <button
                type="button"
                class="memory-arrow"
                id="memoryNext"
                aria-label="Próxima memória"
            >
                →
            </button>

        `;


        memoryInfo.appendChild(
            controls
        );


        const updateMemory =
            () => {

                const slides =
                    memoryInfo.querySelectorAll(
                        ".memory-slide"
                    );


                slides.forEach(
                    slide => {

                        slide.classList.remove(
                            "active"
                        );

                    }
                );


                slides[current]
                    .classList.add(
                        "active"
                    );


                document
                    .getElementById(
                        "memoryCounter"
                    )
                    .textContent =
                    `${current + 1} / ${slides.length}`;

            };


        document
            .getElementById(
                "memoryPrev"
            )
            .addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    current =
                        (
                            current -
                            1 +
                            family.memories.length
                        )
                        %
                        family.memories.length;


                    updateMemory();

                }
            );


        document
            .getElementById(
                "memoryNext"
            )
            .addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    current =
                        (
                            current + 1
                        )
                        %
                        family.memories.length;


                    updateMemory();

                }
            );

    }


    /* =========================================
       CRIAR MODAL
    ========================================= */

    let modal =
        document.getElementById(
            "memoryModal"
        );


    if (!modal) {

        modal =
            document.createElement(
                "div"
            );


        modal.id =
            "memoryModal";


        modal.className =
            "memory-modal";


        modal.innerHTML = `

            <div
                class="memory-modal-content"
                role="dialog"
                aria-modal="true"
            >

                <button
                    type="button"
                    class="memory-modal-close"
                    onclick="closeMemoryModal()"
                    aria-label="Fechar"
                >
                    ✕
                </button>


                <img
                    id="memoryModalImage"
                    class="memory-modal-image"
                    src=""
                    alt=""
                >


                <div
                    id="memoryModalTitle"
                    class="memory-modal-title"
                ></div>


                <div
                    id="memoryModalDescription"
                    class="memory-modal-description"
                ></div>


                <div
                    class="memory-modal-controls"
                >

                    <button
                        type="button"
                        class="memory-modal-arrow"
                        id="memoryModalPrev"
                        aria-label="Memória anterior"
                    >
                        ←
                    </button>


                    <div
                        class="memory-modal-counter"
                        id="memoryModalCounter"
                    >
                    </div>


                    <button
                        type="button"
                        class="memory-modal-arrow"
                        id="memoryModalNext"
                        aria-label="Próxima memória"
                    >
                        →
                    </button>

                </div>

            </div>

        `;


        document.body.appendChild(
            modal
        );


        /* FECHAR CLICANDO FORA */

        modal.addEventListener(
            "click",
            event => {

                if (
                    event.target === modal
                ) {

                    closeMemoryModal();

                }

            }
        );


        /* SETA ESQUERDA */

        document
            .getElementById(
                "memoryModalPrev"
            )
            .addEventListener(
                "click",
                event => {

                    event.stopPropagation();


                    current =
                        (
                            current -
                            1 +
                            family.memories.length
                        )
                        %
                        family.memories.length;


                    updateMemoryModal(
                        current
                    );

                }
            );


        /* SETA DIREITA */

        document
            .getElementById(
                "memoryModalNext"
            )
            .addEventListener(
                "click",
                event => {

                    event.stopPropagation();


                    current =
                        (
                            current + 1
                        )
                        %
                        family.memories.length;


                    updateMemoryModal(
                        current
                    );

                }
            );

    }


    /* =========================================
       ATUALIZAR MODAL
    ========================================= */

    function updateMemoryModal(
        index
    ) {

        const memory =
            family.memories[index];


        document
            .getElementById(
                "memoryModalImage"
            )
            .src =
            memory.image;


        document
            .getElementById(
                "memoryModalImage"
            )
            .alt =
            memory.title;


        document
            .getElementById(
                "memoryModalTitle"
            )
            .textContent =
            memory.title;


        document
            .getElementById(
                "memoryModalDescription"
            )
            .textContent =
            memory.description;


        document
            .getElementById(
                "memoryModalCounter"
            )
            .textContent =
            `${index + 1} / ${family.memories.length}`;

    }


    /* =========================================
       ABRIR MODAL
    ========================================= */

    window.openMemoryModal =
        function(index) {

            current = index;


            updateMemoryModal(
                current
            );


            document
                .getElementById(
                    "memoryModal"
                )
                .classList.add(
                    "active"
                );


            document.body.style.overflow =
                "hidden";

        };


    /* =========================================
       FECHAR MODAL
    ========================================= */

    window.closeMemoryModal =
        function() {

            document
                .getElementById(
                    "memoryModal"
                )
                .classList.remove(
                    "active"
                );


            document.body.style.overflow =
                "";

        };

}


/* =========================================
   ESC PARA FECHAR MEMÓRIA
========================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            const modal =
                document.getElementById(
                    "memoryModal"
                );


            if (
                modal &&
                modal.classList.contains(
                    "active"
                )
            ) {

                closeMemoryModal();

            }

        }

    }
);
